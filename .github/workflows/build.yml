name: Build OrangeFox R12 - Galaxy Tab A7 GTA4L

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      FOX_BUILD_DEVICE: gta4l
      FOX_VANILLA_BUILD: 1
      OF_FORCE_PREBUILT_KERNEL: 1

      # GTA4L is A-only, not A/B.
      FOX_AB_DEVICE: 0

      # Use the exact kernel that is already known to boot on the tablet.
      TARGET_PREBUILT_KERNEL: ${{ github.workspace }}/prebuilts/kernel/gta4l/Image.gz-dtb

    steps:

      - name: Checkout Build-Kernel repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo apt-get clean

          df -h

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            openjdk-11-jdk \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Install repo
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          repo --version

      - name: Prepare OrangeFox source tree
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/orangefox"
          cd "$GITHUB_WORKSPACE/orangefox"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # OrangeFox R12 source branch
          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://gitlab.com/OrangeFox/sync.git \
            orangefox-sync

          cd orangefox-sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh --branch fox_12.1

      - name: Add GTA4L device trees
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          mkdir -p device/samsung

          # Device-specific tree
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l.git \
            device/samsung/gta4l

          # Common GTA4L tree
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l-common.git \
            device/samsung/gta4l-common

      - name: Install exact prebuilt kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          mkdir -p prebuilts/kernel/gta4l

          cp \
            "$GITHUB_WORKSPACE/prebuilts/kernel/gta4l/Image.gz-dtb" \
            prebuilts/kernel/gta4l/Image.gz-dtb

          test -f prebuilts/kernel/gta4l/Image.gz-dtb

          echo "Prebuilt kernel:"
          ls -lh prebuilts/kernel/gta4l/Image.gz-dtb

          echo "SHA256:"
          sha256sum prebuilts/kernel/gta4l/Image.gz-dtb

      - name: Verify GTA4L configuration
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          echo "=== Device BoardConfig ==="
          sed -n '1,220p' device/samsung/gta4l/BoardConfig.mk

          echo
          echo "=== Common BoardConfig ==="
          sed -n '1,280p' device/samsung/gta4l-common/BoardConfigCommon.mk

          echo
          echo "=== Prebuilt kernel ==="
          file prebuilts/kernel/gta4l/Image.gz-dtb

      - name: Configure OrangeFox environment
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          export FOX_BUILD_DEVICE=gta4l
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_AB_DEVICE=0

          export TARGET_ARCH=arm64

          # Tell the Android build system which already-built kernel to use.
          export TARGET_PREBUILT_KERNEL="$GITHUB_WORKSPACE/orangefox/prebuilts/kernel/gta4l/Image.gz-dtb"

          # Use ccache to reduce rebuild time if the runner cache is available.
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G || true

          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
          echo "FOX_VANILLA_BUILD=$FOX_VANILLA_BUILD"
          echo "OF_FORCE_PREBUILT_KERNEL=$OF_FORCE_PREBUILT_KERNEL"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "TARGET_PREBUILT_KERNEL=$TARGET_PREBUILT_KERNEL"

      - name: Lunch OrangeFox
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          export FOX_BUILD_DEVICE=gta4l
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_AB_DEVICE=0
          export TARGET_ARCH=arm64
          export TARGET_PREBUILT_KERNEL="$GITHUB_WORKSPACE/orangefox/prebuilts/kernel/gta4l/Image.gz-dtb"

          source build/envsetup.sh

          lunch twrp_gta4l-eng

      - name: Build OrangeFox recovery
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          export FOX_BUILD_DEVICE=gta4l
          export FOX_VANILLA_BUILD=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_AB_DEVICE=0
          export TARGET_ARCH=arm64
          export TARGET_PREBUILT_KERNEL="$GITHUB_WORKSPACE/orangefox/prebuilts/kernel/gta4l/Image.gz-dtb"

          source build/envsetup.sh
          lunch twrp_gta4l-eng

          echo "Starting OrangeFox build..."

          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Verify output
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          OUTPUT="out/target/product/gta4l/OrangeFox-unofficial-gta4l.img"

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: OrangeFox image was not produced."
            find out/target/product/gta4l -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi

          echo "OrangeFox build successful!"
          ls -lh "$OUTPUT"

          echo
          echo "SHA256:"
          sha256sum "$OUTPUT"

      - name: Upload OrangeFox image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12-gta4l
          path: |
            orangefox/out/target/product/gta4l/OrangeFox-unofficial-gta4l.img
            orangefox-build.log
          if-no-files-found: error
          retention-days: 14
