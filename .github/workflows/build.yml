name: Inspect OrangeFox - Galaxy Tab A7

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            lib32z1-dev \
            libncurses-dev \
            libreadline-dev \
            lz4 \
            lzop \
            openjdk-11-jdk \
            python3 \
            rsync \
            unzip \
            zip \
            zstd

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Set OrangeFox environment
        run: |
          echo "FOX_BUILD_DEVICE=gta4l" >> "$GITHUB_ENV"
          echo "FOX_VANILLA_BUILD=1" >> "$GITHUB_ENV"

      - name: Sync OrangeFox source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox"
          cd "$GITHUB_WORKSPACE/fox"

          repo init \
            --depth=1 \
            -u https://gitlab.com/OrangeFox/Manifest.git \
            -b fox_12.1

          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

      - name: Clone Android 16 device tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          rm -rf device/samsung/gta4l

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l.git \
            device/samsung/gta4l

      - name: Clone Android 16 common tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          rm -rf device/samsung/gta4l-common

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l-common.git \
            device/samsung/gta4l-common

      - name: Clone SM6115 kernel
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          rm -rf kernel/samsung/sm6115

          git clone \
            --depth=1 \
            https://github.com/chrmhoffmann/android_kernel_samsung_sm6115.git \
            kernel/samsung/sm6115

      - name: Inspect Android 16 device tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "DEVICE TREE FILES"
          echo "========================================"

          find device/samsung/gta4l \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "========================================"
          echo "COMMON TREE FILES"
          echo "========================================"

          find device/samsung/gta4l-common \
            -maxdepth 3 \
            -type f \
            | sort

          echo
          echo "========================================"
          echo "RECOVERY / FSTAB FILES"
          echo "========================================"

          find device/samsung/gta4l \
               device/samsung/gta4l-common \
            -type f \
            \( \
              -iname '*fstab*' \
              -o -iname '*recovery*' \
              -o -iname '*init*.rc' \
              -o -iname '*ramdisk*' \
            \) \
            -print \
            | sort

      - name: Inspect BoardConfig
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "BoardConfig.mk"
          echo "========================================"

          cat device/samsung/gta4l/BoardConfig.mk

          echo
          echo "========================================"
          echo "BoardConfigCommon.mk"
          echo "========================================"

          cat device/samsung/gta4l-common/BoardConfigCommon.mk

      - name: Inspect product definitions
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "AndroidProducts.mk"
          echo "========================================"

          cat device/samsung/gta4l/AndroidProducts.mk

          echo
          echo "========================================"
          echo "lineage_gta4l.mk"
          echo "========================================"

          cat device/samsung/gta4l/lineage_gta4l.mk

          echo
          echo "========================================"
          echo "device.mk"
          echo "========================================"

          cat device/samsung/gta4l/device.mk

      - name: Inspect fstab candidates
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "FSTAB CONTENT"
          echo "========================================"

          while IFS= read -r file; do
            echo
            echo "----------------------------------------"
            echo "$file"
            echo "----------------------------------------"
            cat "$file"
          done < <(
            find device/samsung/gta4l \
                 device/samsung/gta4l-common \
              -type f \
              \( -iname '*fstab*' \) \
              -print \
              | sort
          )

      - name: Inspect recovery references
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "RECOVERY REFERENCES"
          echo "========================================"

          grep -RniE \
            'TARGET_RECOVERY|RECOVERY_FSTAB|TW_|OF_|BOARD_RECOVERY|RECOVERYIMAGE|recoveryimage' \
            device/samsung/gta4l \
            device/samsung/gta4l-common \
            2>/dev/null \
            | head -n 500 || true

      - name: Inspect kernel configuration
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "KERNEL TREE"
          echo "========================================"

          ls -la kernel/samsung/sm6115

          echo
          echo "========================================"
          echo "DEFCONFIG REFERENCES"
          echo "========================================"

          grep -RniE \
            'defconfig|gta4l-common.config|TARGET_KERNEL' \
            device/samsung/gta4l \
            device/samsung/gta4l-common \
            2>/dev/null \
            || true

      - name: Inspect OrangeFox environment
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "ORANGEFOX SOURCE"
          echo "========================================"

          git -C . status --short || true

          echo
          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
          echo "FOX_VANILLA_BUILD=$FOX_VANILLA_BUILD"

      - name: Check build environment
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          set +e

          source build/envsetup.sh

          echo
          echo "========================================"
          echo "AVAILABLE GTA4L LUNCH TARGETS"
          echo "========================================"

          lunch 2>&1 | grep -i gta4l || true

          echo
          echo "========================================"
          echo "ALL LUNCH TARGETS CONTAINING TWRP/FOX"
          echo "========================================"

          lunch 2>&1 | grep -Ei 'twrp|orangefox|fox' || true

          echo
          echo "========================================"
          echo "ENVIRONMENT STATUS"
          echo "========================================"

          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
          echo "OUT_DIR=$OUT_DIR"
          echo "FOX_MANIFEST_ROOT=$FOX_MANIFEST_ROOT"

      - name: Upload inspection output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta4l-android16-orangefox-inspection
          path: |
            fox/device/samsung/gta4l/
            fox/device/samsung/gta4l-common/
          if-no-files-found: warn
