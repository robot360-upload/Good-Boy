name: Build OrangeFox - Galaxy Tab A7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libreadline-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Configure OrangeFox
        run: |
          echo "FOX_BUILD_DEVICE=gta4l" >> "$GITHUB_ENV"
          echo "FOX_VANILLA_BUILD=1" >> "$GITHUB_ENV"

      - name: Sync OrangeFox
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox"

          cd "$GITHUB_WORKSPACE/fox"

          git clone \
            https://gitlab.com/OrangeFox/sync.git \
            orangefox-sync

          cd orangefox-sync

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox"

      - name: Clone device tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          git clone \
            -b lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l.git \
            device/samsung/gta4l

      - name: Clone common device tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          git clone \
            -b lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l-common.git \
            device/samsung/gta4l-common

      - name: Show source tree
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "Device tree:"
          echo "========================================"
          ls -la device/samsung/gta4l

          echo "========================================"
          echo "Common tree:"
          echo "========================================"
          ls -la device/samsung/gta4l-common

      - name: Build OrangeFox
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
          echo "FOX_VANILLA_BUILD=$FOX_VANILLA_BUILD"

          source build/envsetup.sh

          lunch twrp_gta4l-eng

          mka recoveryimage 2>&1 | tee build.log

      - name: Find output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/fox"

          echo "========================================"
          echo "Build output:"
          echo "========================================"

          find out/target/product/gta4l \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            2>/dev/null || true

      - name: Upload OrangeFox image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-gta4l
          path: |
            fox/out/target/product/gta4l/OrangeFox-unofficial-gta4l.img
            fox/out/target/product/gta4l/recovery.img
            fox/build.log
          if-no-files-found: warn
