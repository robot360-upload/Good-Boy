name: Build OrangeFox R12 - Galaxy Tab A7 GTA4L

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      FOX_BUILD_DEVICE: gta4l
      FOX_VANILLA_BUILD: 1
      FOX_AB_DEVICE: 0
      OF_FORCE_PREBUILT_KERNEL: 1
      TARGET_ARCH: arm64
      ALLOW_MISSING_DEPENDENCIES: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          sudo apt-get clean

          df -h

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            openjdk-11-jdk \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Install repo
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Sync OrangeFox 12.1 source
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox_sync"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync"

          git clone \
            https://gitlab.com/OrangeFox/sync.git

          cd sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/orangefox"

      - name: Verify OrangeFox source
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          test -f build/envsetup.sh
          test -d bootable/recovery
          test -d vendor/recovery

          echo "OrangeFox source OK"

      - name: Add GTA4L device trees
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          mkdir -p device/samsung

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l.git \
            device/samsung/gta4l

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l-common.git \
            device/samsung/gta4l-common

      - name: Install prebuilt kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          mkdir -p prebuilts/kernel/gta4l

          test -f \
            "$GITHUB_WORKSPACE/prebuilts/kernel/gta4l/Image.gz-dtb"

          cp \
            "$GITHUB_WORKSPACE/prebuilts/kernel/gta4l/Image.gz-dtb" \
            prebuilts/kernel/gta4l/Image.gz-dtb

          echo "Prebuilt kernel:"
          ls -lh prebuilts/kernel/gta4l/Image.gz-dtb

          echo "SHA256:"
          sha256sum prebuilts/kernel/gta4l/Image.gz-dtb

      - name: Create OrangeFox product definition
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          cat > device/samsung/gta4l/twrp_gta4l.mk <<'EOF'
          #
          # OrangeFox recovery product for Samsung Galaxy Tab A7
          #

          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)

          $(call inherit-product, device/samsung/gta4l/device.mk)

          PRODUCT_DEVICE := gta4l
          PRODUCT_NAME := twrp_gta4l
          PRODUCT_BRAND := samsung
          PRODUCT_MODEL := SM-T505
          PRODUCT_MANUFACTURER := samsung
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("device/samsung/gta4l/AndroidProducts.mk")

          text = p.read_text()

          if "twrp_gta4l.mk" not in text:
              text += "\nPRODUCT_MAKEFILES += \\\n    $(LOCAL_DIR)/twrp_gta4l.mk\n"

          p.write_text(text)
          PY

          echo "=== AndroidProducts.mk ==="
          cat device/samsung/gta4l/AndroidProducts.mk

          echo
          echo "=== twrp_gta4l.mk ==="
          cat device/samsung/gta4l/twrp_gta4l.mk

      - name: Configure prebuilt kernel
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/orangefox"

          export FOX_BUILD_DEVICE=gta4l
          export FOX_VANILLA_BUILD=1
          export FOX_AB_DEVICE=0
          export OF_FORCE_PREBUILT_KERNEL=1
          export TARGET_ARCH=arm64

          export TARGET_PREBUILT_KERNEL="$PWD/prebuilts/kernel/gta4l/Image.gz-dtb"

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          ccache -M 10G || true

          echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
          echo "FOX_VANILLA_BUILD=$FOX_VANILLA_BUILD"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "OF_FORCE_PREBUILT_KERNEL=$OF_FORCE_PREBUILT_KERNEL"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "TARGET_PREBUILT_KERNEL=$TARGET_PREBUILT_KERNEL"

      - name: Validate build target BEFORE compilation
        run: |
          set -x

          cd "$GITHUB_WORKSPACE/orangefox"

          export FOX_BUILD_DEVICE=gta4l
          export FOX_VANILLA_BUILD=1
          export FOX_AB_DEVICE=0
          export OF_FORCE_PREBUILT_KERNEL=1
          export TARGET_ARCH=arm64
          export TARGET_PREBUILT_KERNEL="$PWD/prebuilts/kernel/gta4l/Image.gz-dtb"

          source build/envsetup.sh

          lunch twrp_gta4l-eng

          echo "OrangeFox target successfully selected"

          get_build_var TARGET_PRODUCT
          get_build_var PRODUCT_DEVICE
          get_build_var TARGET_ARCH
          get_build_var TARGET_PREBUILT_KERNEL
          get_build_var TARGET_KERNEL_SOURCE

      - name: Build OrangeFox
        run: |
          set -x

          cd "$GITHUB_WORKSPACE/orangefox"

          export FOX_BUILD_DEVICE=gta4l
          export FOX_VANILLA_BUILD=1
          export FOX_AB_DEVICE=0
          export OF_FORCE_PREBUILT_KERNEL=1
          export TARGET_ARCH=arm64
          export TARGET_PREBUILT_KERNEL="$PWD/prebuilts/kernel/gta4l/Image.gz-dtb"

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          source build/envsetup.sh

          lunch twrp_gta4l-eng

          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/orangefox-build.log"

      - name: Verify OrangeFox image
        run: |
          set -eux

          OUTPUT="$GITHUB_WORKSPACE/orangefox/out/target/product/gta4l/OrangeFox-unofficial-gta4l.img"

          if [ ! -f "$OUTPUT" ]; then
            echo "OrangeFox image was not generated."

            find \
              "$GITHUB_WORKSPACE/orangefox/out/target/product/gta4l" \
              -maxdepth 2 \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo "======================================"
          echo "OrangeFox build successful"
          echo "======================================"

          ls -lh "$OUTPUT"

          echo
          echo "SHA256:"
          sha256sum "$OUTPUT"

      - name: Upload OrangeFox recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12-gta4l
          path: |
            orangefox/out/target/product/gta4l/OrangeFox-unofficial-gta4l.img
            orangefox-build.log
          if-no-files-found: error
          retention-days: 14
